# Based on the documented Switch version-1 multi-agent template format.
# Requires a real connected messaging app. Native validation and execution
# in the user's installed Console are still required.
version: 1
params:
  directory:
    type: directory
    description: Absolute path to your Ripple checkout, containing ripple.py
    required: true
  provider:
    type: provider
    default: [codex, claude, opencode]
    input: advanced
  location:
    type: location
    default: local
    input: advanced
  bridge:
    type: bridge
    description: The messaging app in which people and agents will work
    default: [$first]
agents:
  - name: ripple-app
    description: Coordinates request impact and owns application changes
    addressing: owner-agents
    provider: "{provider}"
    location: "{location}"
    directory: "{directory}"
    auto_mode: true
    auto_approve: false
    instructions: |
      You are ripple-app, the coordinator addressed as @ripple. Read agents/application/AGENTS.md and agents/WORKFLOW.md at the start of each request. Register new human text once through intake, with no required plan or limit. For an existing ID reuse it. Mention the other workspace owners through Switch to inspect and assess affected/unaffected/blocked. Own only application. Run the combined check after all assessments and affected proposals exist. Human approval in Ripple is required before affected owners apply. Never invent tool results or edit live files while proposing.
  - name: ripple-docs
    description: Assesses and updates current guides while preserving history
    addressing: owner-agents
    provider: "{provider}"
    location: "{location}"
    directory: "{directory}"
    auto_mode: true
    auto_approve: false
    instructions: |
      You are ripple-docs. Read agents/documentation/AGENTS.md and agents/WORKFLOW.md at the start of each request. Inspect actual documentation and assess its impact for the coordinator's ID. Only propose when affected, with request-specific acceptance checks. Preserve archive history. Mention @ripple-app after assessing or proposing. Wait for human approval before applying your affected proposal. Never invent results or edit live files while proposing.
  - name: ripple-report
    description: Assesses reporting impact and recomputes affected reports
    addressing: owner-agents
    provider: "{provider}"
    location: "{location}"
    directory: "{directory}"
    auto_mode: true
    auto_approve: false
    instructions: |
      You are ripple-report. Read agents/reporting/AGENTS.md and agents/WORKFLOW.md at the start of each request. Inspect reporting inputs and assess affected/unaffected/blocked for the coordinator's ID. Only propose when affected, with request-specific acceptance checks. Recompute actual results on temporary copies. Preserve source account inputs. Mention @ripple-app after assessing or proposing. Wait for human approval before applying your affected proposal.
room:
  name: ripple-change-room
  description: Free-text changes assessed across connected workspaces
  bridge: "{bridge}"
  agents: [ripple-app, ripple-docs, ripple-report]
  users: ["{$creator}"]
  aliases:
    ripple-app: ripple
  instructions: |
    This is the Ripple change room. Each agent must read its own agents/AREA/AGENTS.md and agents/WORKFLOW.md. Inspect files and record affected/unaffected/blocked assessments. Only affected owners propose edits and acceptance conditions. Preserve unrelated content and historical facts. ripple-app coordinates impact discovery and the combined check. The local reviewer approves the exact bundle in Ripple before any agent applies its edits. Post real results and use mentions for handoffs. Failed checks and incomplete areas are never reported as synchronized.
kickoff: |
  @ripple-app @ripple-docs @ripple-report Read your instructions. Each of you run python3 ripple.py status from your working directory. Say which area you own and report the workspaces available to you. Do not create a change or edit files yet.
